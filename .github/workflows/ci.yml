name: CI

# H8 · ADR-009 "orden de puertas que falla rápido". No hace deploy — ver
# docs/runbooks/despliegue.md (el usuario decide cuándo publicar/desplegar).
on:
  push:
    branches: ["**"]
  pull_request:

# Cancela una corrida anterior en el mismo PR/rama si llega un push nuevo -- no gasta
# minutos de CI en un commit ya superado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test (unit + integración + adversarial, embedded-postgres real)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      # fetch-depth: 0 (historial completo, no el shallow clone default de depth=1):
      # tests/unit/gob/cierre-tarea-conventional-commits.spec.ts corre contra el git
      # log REAL de este repo (una tarea de muestra ya cerrada, sin mocks del
      # historial) -- con un checkout superficial, `git log` solo ve el commit del
      # push actual y CUALQUIER tarea de muestra reporta "0 commits la referencian",
      # sin importar cuál se elija (falla real encontrada en CI, no reproducible en
      # local porque el checkout local siempre tiene el historial completo).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      # ADR-003: embedded-postgres descarga un binario real de Postgres para
      # linux-x64 vía optionalDependencies -- npm ci ya lo resuelve, sin Docker ni un
      # `services: postgres:` de GitHub Actions (cada archivo de prueba abre su propio
      # cluster efímero, igual que en desarrollo local).
      - run: node --experimental-strip-types scripts/check-migraciones.ts
      # auditoria-2/arquitectura [ALTO]: falla si apps/api/package.json y la
      # documentación del runtime real (--experimental-strip-types vs.
      # --experimental-transform-types) vuelven a divergir -- ver
      # scripts/check-runtime-flags.ts.
      - run: node --experimental-strip-types scripts/check-runtime-flags.ts
      # REQ-AGT-018 (GOB-059/BP-141): falla si aparece un `if provider === X`/
      # `if pms === X` (o `switch(provider|pms)`) fuera del registro único de
      # conectores (packages/mcp-servers/pms/src/registry.ts) -- ver
      # scripts/checks/registro-unico-conectores.ts. Corre también dentro de
      # `npm test` (tests/unit/mcp-servers/pms/registro-unico-conectores.spec.ts),
      # este paso además la hace fallar rápido, antes de la suite completa
      # (ADR-009).
      - run: node scripts/checks/registro-unico-conectores.ts
      # REQ-AGT-019 (BP-132..135/GOB-048): falla si una tarea del backlog de archivos
      # (tasks/**, GOB-045) que module archivos de agentes/precios/dinero/control físico
      # no declara un `gate` válido (`connector`/`money`/`physical`/`none`), si el `gate`
      # declarado no coincide con la categoría sensible que sus `paths` tocan, o si falta
      # la prueba (contract test / determinismo de precio / laboratorio físico) que ese
      # gate exige -- ver scripts/checks/gate-por-tarea.ts. Corre también dentro de
      # `npm test` (tests/unit/gob/gate-por-tarea.spec.ts, contra directorios temporales
      # sintéticos), este paso además la hace fallar rápido contra el backlog real, antes
      # de la suite completa (ADR-009).
      - run: node scripts/checks/gate-por-tarea.ts
      # REQ-SEG-003/REQ-HUE-022 (BP-091/H19-003): falla si aparece una librería/API de
      # reconocimiento facial (AWS Rekognition, Azure Face API, Face++, Kairos,
      # face-api.js, etc.) o su vocabulario genérico en `apps/`/`packages/`, o si algún
      # campo de dato biométrico (huella, iris, voz, ADN) se captura sin un tipo de
      # consentimiento diferenciado del aviso general -- ver
      # scripts/checks/no-biometria-facial.ts (compartido, un solo check, entre ambos
      # requisitos). Corre también dentro de `npm test`
      # (tests/adversarial/consentimiento-biometrico.spec.ts, que además verifica de
      # extremo a extremo contra `embedded-postgres` real que un check-in sin
      # consentimiento biométrico persiste 0 dato biométrico), este paso además la hace
      # fallar rápido, antes de la suite completa (ADR-009).
      - run: node scripts/checks/no-biometria-facial.ts
      # REQ-AGT-006 (GOB-035/BP-123/H08-020/BP-168): falla si aparece una librería/API/
      # vendor de reconocimiento de LOCUTOR (voiceprint/speaker recognition) o de
      # reconocimiento facial en `apps/`/`packages/` -- verificación independiente de la
      # de REQ-SEG-003/REQ-HUE-022 de arriba (ese script solo cubre lo facial; este cubre
      # ambas, con su propia lista de patrones, ver comentario de archivo) -- ver
      # scripts/checks/no-voiceprint-facial.ts. Corre también dentro de `npm test`
      # (tests/adversarial/pii-redaction-trazas.spec.ts, que además verifica de extremo a
      # extremo contra `embedded-postgres` real que una traza sintética con PII persiste
      # 0 PII en `audit_log`/`agent_run`), este paso además la hace fallar rápido, antes
      # de la suite completa (ADR-009).
      - run: node scripts/checks/no-voiceprint-facial.ts
      # REQ-QA-002 (GOB-012): falla si aparece `xit(`/`xdescribe(`/`it.skip(`/
      # `describe.skip(` en `tests/` (prohibidos sin excepción -- ninguna forma de
      # documentar un motivo), o un `test.skip(` (Playwright) fuera de `tests/e2e/`, o
      # dentro de `tests/e2e/` sin un motivo documentado (segundo argumento no vacío) --
      # "nunca se debe comentar, borrar ni marcar `skip` una prueba existente" hecho
      # verificable en CI, no solo convención -- ver scripts/checks/no-tests-skip.ts.
      # Corre también dentro de `npm test` (tests/unit/qa/no-tests-skip.spec.ts, contra
      # fixtures sintéticas), este paso además la hace fallar rápido contra `tests/`
      # real, antes de la suite completa (ADR-009).
      - run: node scripts/checks/no-tests-skip.ts
      # REQ-GOB-005: falla si una tarea del backlog de archivos (tasks/**, GOB-045) en
      # estado `review`/`done` no tiene EXACTAMENTE un commit real de `git log` que la
      # referencie (0 -> cierre sin commit real; 2+ -> "uno por tarea" no se cumple), o
      # si ese único commit no sigue Conventional Commits -- ver
      # scripts/checks/cierre-tarea-conventional-commits.ts (ADR-012 documenta por qué
      # es un script separado de evidencia-obligatoria-cierre.ts/REQ-OBS-010 en vez de
      # uno solo). Corre también dentro de `npm test`
      # (tests/unit/gob/cierre-tarea-conventional-commits.spec.ts, contra fixtures
      # sintéticas, un repositorio git real y la tarea de muestra REAL ya cerrada de
      # este repo, REQ-GOB-004), este paso además la hace fallar rápido contra el
      # backlog real, antes de la suite completa (ADR-009).
      - run: node scripts/checks/cierre-tarea-conventional-commits.ts
      # REQ-SEG-013 (GOB-041): falla si aparece un `.env` real (no `.env.example`)
      # trackeado por git, si un `.env.example` trae un valor no vacío para una clave
      # de nombre sensible (`*_SECRET`/`*_TOKEN`/`*_KEY`/`*_PASSWORD`), o si aparece un
      # literal de aspecto real asignado a un nombre sensible en `apps/*/src` o
      # `packages/*/src` (sin contar los `FAKE_*`/`DEV_*` ya documentados como
      # simulados/de desarrollo) -- ver scripts/checks/env-sin-secretos-reales.ts. Este
      # script SOLO cubre la mitad estática de REQ-SEG-013; la capa de Vault/KMS en
      # producción (apps/api/src/lib/secretsProvider.ts) sigue sin credenciales/
      # infraestructura real para probarse de extremo a extremo (ver
      # docs/REQUISITOS.md).
      - run: node scripts/checks/env-sin-secretos-reales.ts
      - run: npm test
      - name: Guardar logs de prueba como artifact (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: docs/logs/**
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/**
          retention-days: 7

  e2e:
    name: e2e (Playwright, Chrome del runner)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build
      # Instala el canal "chrome" real (no solo Chromium genérico) -- mismo canal que
      # tests/e2e usa en desarrollo (`channel: 'chrome'`, docs/runbooks/despliegue.md
      # §3), para que CI y desarrollo corran contra el mismo navegador.
      - run: npx --prefix apps/web playwright install --with-deps chrome
      - name: Playwright E2E
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Subir capturas de paridad visual como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/**
          if-no-files-found: warn
          retention-days: 14
      - name: Subir trazas de Playwright (solo si algo falló) como artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/.playwright-results/**
          if-no-files-found: ignore
          retention-days: 14

  npm-audit:
    name: npm audit (bloqueante en high/critical de runtime)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      # ADR-009: bloqueante solo para dependencias de runtime, no de tooling --
      # `npm audit --audit-level=high` ya reporta el árbol completo; las excepciones
      # documentadas (CVE/paquete/alcance/decisión) viven en
      # docs/auditoria-1/dependencias.md, nunca silenciadas sin registro.
      - run: npm audit --audit-level=high

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # REQ-SEG-012 (GOB-014/GOB-040): "nunca debe persistirse PAN, CVV, e.firma
      # (.cer/.key/.pfx/.p12), tokens de API ni contraseñas en código, logs, fixtures,
      # prompts o commits; CI debe ejecutar escaneo de secretos en cada PR" -- este job
      # corre gitleaks (reglas por defecto + `.gitleaks.toml`, ver ese archivo para el
      # detalle de reglas propias PAN/CVV/e.firma y los allowlists documentados de datos
      # de PRUEBA nunca reales) contra el historial completo (`fetch-depth: 0`) en cada
      # push/PR, y falla el job (bloqueante) si encuentra un hallazgo real. Verificación
      # manual previa (repo real, 0 hallazgos; y que SÍ bloquea un secreto de prueba
      # inyectado): docs/logs/REQ-SEG-012/.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

